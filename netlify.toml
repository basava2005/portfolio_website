[build]
  command = "pnpm run build:portfolio"
  publish = "artifacts/portfolio/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.32.1"
  BASE_PATH = "/"

[[redirects]]
  from = "/api/*"
  to = "https://your-api-server.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
