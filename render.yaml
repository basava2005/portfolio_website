services:
  - type: web
    name: portfolio-api
    env: node
    plan: free
    buildCommand: pnpm install && pnpm run build:api
    startCommand: pnpm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
